<section class="bg-black py-16 sm:py-24 md:py-32">
  <div class="mx-auto max-w-[1440px] px-4 sm:px-6 md:px-12">
    <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
      @for (cap of capabilities(); track cap.label) {
        <article
          class="rounded-xl border border-border bg-surface p-6 transition-colors duration-180 hover:border-[#3A3A3A] sm:p-8"
        >
          <h3 class="mb-3 font-[Anton] text-lg text-white uppercase sm:text-xl">{{ cap.title }}</h3>
          <p class="text-sm leading-relaxed text-muted">{{ cap.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
