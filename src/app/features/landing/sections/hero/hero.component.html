<section class="relative flex min-h-screen items-center justify-center overflow-hidden">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <div class="relative z-10 mx-auto max-w-[1440px] px-4 text-center sm:px-6 md:px-12">
    <div class="mb-6 inline-block rounded border border-primary/40 bg-primary/10 px-3 py-1.5 sm:mb-8 sm:px-4 sm:py-2">
      <span class="font-[JetBrains_Mono] text-xs tracking-widest text-primary uppercase sm:text-xs">
        EN 12464-1 Compliant
      </span>
    </div>

    <h1
      class="font-[Anton] text-5xl leading-none tracking-tight text-white uppercase sm:text-7xl md:text-8xl lg:text-[5rem] xl:text-[6.5rem]"
    >
      Lighting Design<br />At Scale
    </h1>

    <p class="mx-auto mt-4 max-w-2xl px-2 text-base text-muted sm:mt-6 sm:text-lg">
      Next-generation AI engine for automated photometric layout engineering. Architecting
      code-compliant lighting schemes in seconds.
    </p>

    <div class="mt-6 flex flex-col items-center gap-3 sm:mt-10 sm:flex-row sm:justify-center sm:gap-4">
      <div class="relative flex w-full sm:w-auto">
        <a
          routerLink="/create-study"
          class="flex h-12 flex-1 items-center justify-center rounded-l-xl bg-primary px-6 text-sm font-medium text-white transition-colors duration-180 hover:bg-primary-dark focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white sm:px-8"
        >
          Start New Study
        </a>
        <button
          type="button"
          class="flex h-12 w-11 shrink-0 items-center justify-center rounded-r-xl border-l border-white/20 bg-primary text-white transition-colors duration-180 hover:bg-primary-dark focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
          [attr.aria-expanded]="studyMenuOpen()"
          aria-haspopup="menu"
          aria-controls="study-options-menu"
          aria-label="More study options"
          (click)="toggleStudyMenu($event)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="transition-transform duration-180"
            [class.rotate-180]="studyMenuOpen()"
            aria-hidden="true"
          >
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>
        @if (studyMenuOpen()) {
          <div
            id="study-options-menu"
            role="menu"
            class="absolute top-full right-0 z-20 mt-2 min-w-[200px] rounded-xl border border-border bg-surface p-2"
          >
            <a
              routerLink="/cad-study"
              role="menuitem"
              class="flex h-10 items-center rounded-lg px-3 text-sm text-white no-underline transition-colors duration-180 hover:bg-elevated focus-visible:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
              (click)="closeStudyMenu()"
            >
              CAD Study
            </a>
          </div>
        }
      </div>
      <a
        routerLink="/results"
        class="flex h-12 w-full items-center justify-center rounded-xl border border-[#3A3A3A] px-6 text-sm font-medium text-white transition-colors duration-180 hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary sm:w-auto sm:px-8"
      >
        View Last Study
      </a>
    </div>
  </div>

  <div class="scroll-indicator">
    <span class="text-xs tracking-widest uppercase">Scroll</span>
    <svg
      class="bounce-arrow"
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M12 5v14M19 12l-7 7-7-7" />
    </svg>
  </div>
</section>
