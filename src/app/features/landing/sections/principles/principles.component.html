<section id="principles" class="bg-black py-16 sm:py-24 md:py-32">
  <div class="mx-auto max-w-[1440px] px-4 sm:px-6 md:px-12">
    <div class="mb-10 flex flex-col gap-4 sm:mb-16 sm:flex-row sm:items-end sm:justify-between">
      <h2 class="font-[Anton] text-[2.5rem] leading-none text-white uppercase sm:text-[3rem] md:text-[3.5rem]">Our Principles</h2>
      <p class="max-w-md text-right text-sm text-muted sm:text-right">
        The engineering foundations behind every LuxScale AI calculation.
      </p>
    </div>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
      @for (principle of principles(); track principle.number) {
        <article
          class="rounded-xl border border-border bg-surface p-6 transition-colors duration-180 hover:border-[#3A3A3A] sm:p-8"
        >
          <div class="mb-4 flex items-center gap-3 sm:mb-6">
            <span class="font-[JetBrains_Mono] text-xs text-primary">{{ principle.number }}</span>
            <span class="text-primary">/</span>
            <span class="font-[JetBrains_Mono] text-xs text-primary uppercase">{{
              principle.tag
            }}</span>
          </div>
          <h3 class="mb-3 font-[Anton] text-lg text-white uppercase sm:mb-4 sm:text-xl">{{ principle.title }}</h3>
          <p class="text-sm leading-relaxed text-muted">{{ principle.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
