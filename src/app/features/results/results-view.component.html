<div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
  <div class="flex-1">
    <span
      class="mb-3 inline-block rounded bg-primary px-3 py-1 font-mono text-xs font-semibold tracking-[0.1em] text-white"
      >RESULTS</span
    >
    <h1 class="m-0 mb-2 font-display text-2xl leading-tight text-white sm:text-3xl">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="m-0 font-body text-sm text-muted">
        {{ subtitle() }}
      </p>
    }
  </div>
  <div class="flex items-center gap-3">
    @if (showNewStudy()) {
      <a
        routerLink="/create-study"
        class="flex items-center gap-2 whitespace-nowrap rounded-xl border border-border bg-transparent px-4 py-2.5 font-mono text-xs font-medium tracking-widest text-muted uppercase no-underline transition-all duration-180 hover:border-muted hover:text-white sm:px-5 sm:text-xs"
        >NEW STUDY</a
      >
    }
  </div>
</div>

<div
  class="mb-6 grid grid-cols-2 gap-3 rounded-xl border border-border bg-surface px-4 py-4 sm:grid-cols-4 sm:gap-6 sm:px-8 sm:py-5"
>
  <div class="flex flex-col gap-1.5">
    <span class="font-mono text-xs tracking-widest text-muted uppercase">Solutions</span>
    <span class="font-display text-xl leading-none text-white sm:text-2xl">{{
      study().response.solutions.length
    }}</span>
  </div>
  <div class="flex flex-col gap-1.5">
    <span class="font-mono text-xs tracking-widest text-muted uppercase">Compliant</span>
    <span class="font-display text-xl leading-none text-green-500 sm:text-2xl">{{
      compliantCount()
    }}</span>
  </div>
  <div class="flex flex-col gap-1.5">
    <span class="font-mono text-xs tracking-widest text-muted uppercase">Room Area</span>
    <span class="font-display text-xl leading-none text-white sm:text-2xl"
      >{{ bounds().length * bounds().width | number: '1.0-0'
      }}<span class="ml-0.5 font-mono text-xs text-muted">m²</span></span
    >
  </div>
  <div class="flex flex-col gap-1.5">
    <span class="font-mono text-xs tracking-widest text-muted uppercase">Standard</span>
    <span class="font-display text-xl leading-none text-white sm:text-2xl">{{
      standardRef()
    }}</span>
  </div>
</div>

<div class="flex flex-col gap-6">
  <app-room-dimensions
    [width]="bounds().width"
    [length]="bounds().length"
    [ceilingHeight]="study().request.ceilingHeight"
    [mountingHeight]="study().request.mountingHeight"
  />
  <app-standard-row [standard]="study().standard" />
  <app-project-info [projectInfo]="study().project" />
  <app-calculation-meta [result]="study().response" />
  <app-results-grid
    [result]="study().response"
    [variants]="variants()"
    [polygon]="study().request.polygon"
  />
</div>
