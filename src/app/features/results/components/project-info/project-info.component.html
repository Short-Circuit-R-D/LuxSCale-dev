<div class="border border-border rounded-xl bg-surface p-8">
  <div class="flex items-center gap-2 mb-6 pl-3 border-l-2 border-primary">
    <span class="font-mono text-xs text-primary">II.</span>
    <span class="font-mono text-xs text-primary tracking-widest uppercase">Project Information</span>
  </div>

  <div class="grid grid-cols-3 gap-6">
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[0.6875rem] text-muted tracking-widest uppercase">Project Name</span>
      <span class="font-body text-[0.9375rem] text-white">{{ projectInfo().project_name }}</span>
    </div>
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[0.6875rem] text-muted tracking-widest uppercase">Company</span>
      <span class="font-body text-[0.9375rem] text-white">{{ projectInfo().company }}</span>
    </div>
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[0.6875rem] text-muted tracking-widest uppercase">Client Name</span>
      <span class="font-body text-[0.9375rem] text-white">{{ projectInfo().name }}</span>
    </div>
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[0.6875rem] text-muted tracking-widest uppercase">Phone</span>
      <span class="font-body text-[0.9375rem] text-white">{{ projectInfo().phone }}</span>
    </div>
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[0.6875rem] text-muted tracking-widest uppercase">Email</span>
      <span class="font-body text-[0.9375rem] text-white">{{ projectInfo().email }}</span>
    </div>
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[0.6875rem] text-muted tracking-widest uppercase">Mounting Height</span>
      <span class="font-body text-[0.9375rem] text-white">{{ projectInfo().mounting_height }}m</span>
    </div>
  </div>
</div>
