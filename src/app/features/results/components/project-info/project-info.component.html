<div class="border border-border rounded-xl bg-surface p-5 sm:p-8">
  <div class="flex items-center gap-2 mb-6 pl-3 border-l-2 border-primary">
    <span class="font-mono text-xs text-primary">III.</span>
    <span class="font-mono text-xs text-primary tracking-widest uppercase"
      >Project Information</span
    >
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-6 md:grid-cols-3">
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[0.625rem] text-muted tracking-widest uppercase sm:text-[0.6875rem]"
        >Project Name</span
      >
      <span class="font-body text-[0.875rem] text-white sm:text-[0.9375rem]">{{ projectInfo().project_name }}</span>
    </div>
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[0.625rem] text-muted tracking-widest uppercase sm:text-[0.6875rem]">Company</span>
      <span class="font-body text-[0.875rem] text-white sm:text-[0.9375rem]">{{ projectInfo().company }}</span>
    </div>
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[0.625rem] text-muted tracking-widest uppercase sm:text-[0.6875rem]"
        >Client Name</span
      >
      <span class="font-body text-[0.875rem] text-white sm:text-[0.9375rem]">{{ projectInfo().name }}</span>
    </div>
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[0.625rem] text-muted tracking-widest uppercase sm:text-[0.6875rem]">Phone</span>
      <span class="font-body text-[0.875rem] text-white sm:text-[0.9375rem]">{{ projectInfo().phone }}</span>
    </div>
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[0.625rem] text-muted tracking-widest uppercase sm:text-[0.6875rem]">Email</span>
      <span class="font-body text-[0.875rem] text-white sm:text-[0.9375rem]">{{ projectInfo().email }}</span>
    </div>
    <div class="flex flex-col gap-1.5">
      <span class="font-mono text-[0.625rem] text-muted tracking-widest uppercase sm:text-[0.6875rem]"
        >Mounting Height</span
      >
      <span class="font-body text-[0.875rem] text-white sm:text-[0.9375rem]"
        >{{ projectInfo().mounting_height }}m</span
      >
    </div>
  </div>
</div>
