<div
  class="fixed inset-0 z-[60] overflow-y-auto bg-black/70"
  (click)="cancel()"
>
  <div class="flex min-h-full items-center justify-center px-4 py-6">
    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="room-study-title"
      class="relative w-full max-w-2xl rounded-xl border border-border bg-surface p-6 shadow-lg"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="onPanelKeydown($event)"
    >
    <button
      #closeBtn
      type="button"
      class="absolute top-4 right-4 flex min-h-10 min-w-10 items-center justify-center text-muted transition-colors duration-180 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      aria-label="Close"
      (click)="cancel()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
    </button>

    <h2 id="room-study-title" class="pr-12 font-display text-2xl leading-tight text-white uppercase">
      {{ title() }}
    </h2>

    <div class="mt-6">
      <app-room-plan-preview [vertices]="localShape().vertices" [holes]="localShape().holes" />
    </div>

    <div class="mt-6">
      <label class="mb-2 block font-mono text-sm tracking-widest text-muted uppercase" for="room-study-h">
        Mounting height (h)
      </label>
      <input
        id="room-study-h"
        type="number"
        min="0"
        step="any"
        class="box-border w-full rounded-lg border border-border bg-transparent px-3.5 py-2.5 font-body text-sm text-white transition-[border-color] duration-150 placeholder:text-muted focus:border-primary focus:outline-none sm:max-w-xs"
        placeholder="0.00"
        [ngModel]="mountingHeight()"
        (ngModelChange)="onHeightInput($event)"
      />
    </div>

    <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
      <app-searchable-select
        label="Standard category"
        placeholder="Select standard"
        controlId="room-study-category"
        [options]="standardCategories()"
        [value]="standardCategory()"
        [loading]="categoriesLoading()"
        (valueChange)="onStandardSelect($event)"
      />
      <app-searchable-select
        label="Task or activity"
        placeholder="Select task"
        controlId="room-study-task"
        [options]="tasks()"
        [value]="taskOrActivity()"
        [disabled]="!standardCategory()"
        [loading]="tasksLoading()"
        (valueChange)="onTaskSelect($event)"
      />
    </div>

    @if (submitError()) {
      <p class="mt-4 font-mono text-sm text-primary" role="alert">{{ submitError() }}</p>
    }

    <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button
        type="button"
        class="h-12 rounded-xl border border-[#3A3A3A] px-5 text-sm font-medium text-white transition-colors duration-180 hover:border-primary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        (click)="cancel()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="h-12 rounded-xl bg-primary px-5 text-sm font-medium text-white transition-colors duration-180 hover:bg-primary-dark focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white disabled:cursor-not-allowed disabled:opacity-40"
        [disabled]="!canBegin()"
        (click)="beginStudy()"
      >
        {{ submitting() ? 'Begin study…' : 'Begin study' }}
      </button>
    </div>
    </div>
  </div>
</div>
