<footer class="border-t border-border bg-black">
  <div
    class="mx-auto flex max-w-[1440px] flex-col items-center gap-6 px-4 py-8 sm:flex-row sm:justify-between sm:px-6 md:px-12"
  >
    <div class="flex flex-col items-center gap-2 sm:items-start">
      <a routerLink="/">
        <img src="/sc-logo.png" alt="Short Circuit" class="!h-8 !sm:h-8" />
      </a>
      <p class="text-xs text-muted">&copy; 2026 LuxScale AI. All rights reserved.</p>
    </div>
    <nav class="flex flex-wrap items-center justify-center gap-4 sm:gap-8">
      @for (link of footerLinks(); track $index) {
        <a
          [href]="link.href"
          class="text-sm text-muted transition-colors duration-180 hover:text-white"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </div>
</footer>
