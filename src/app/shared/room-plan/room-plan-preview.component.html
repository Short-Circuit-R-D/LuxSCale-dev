<div [class]="chrome() ? 'rounded-xl border border-border bg-elevated p-4 sm:p-5' : ''">
  @if (chrome()) {
    <div class="mb-3 flex items-center justify-between gap-3">
      <span class="font-mono text-xs tracking-widest text-primary uppercase">Layout preview</span>
      @if (caption(); as text) {
        <span class="font-mono text-xs text-muted text-right">{{ text }}</span>
      }
    </div>
  }

  @if (view(); as plan) {
    <div class="aspect-[5/4] w-full">
      <svg
        class="preview-svg h-full w-full"
        [attr.viewBox]="plan.viewBox"
        preserveAspectRatio="xMidYMid meet"
        role="group"
        [attr.aria-label]="ariaLabel()"
      >
        <desc>{{ ariaLabel() }}</desc>

        <path class="room" [attr.d]="plan.path" fill-rule="evenodd" />

        @for (label of plan.labels; track $index) {
          <text
            class="side-label"
            [attr.x]="label.x"
            [attr.y]="label.y"
            [attr.font-size]="plan.fontSize * 0.85"
            [attr.transform]="label.transform"
            text-anchor="middle"
            dominant-baseline="middle"
          >
            {{ label.text }}
          </text>
        }

        @for (fixture of plan.fixtures; track $index) {
          <g class="hit">
            <circle
              class="hit-pad"
              tabindex="0"
              [attr.cx]="fixture.x"
              [attr.cy]="fixture.y"
              [attr.r]="plan.hitR"
              [attr.aria-label]="fixture.aria"
            />
            <circle
              class="mark fixture-mark"
              [attr.cx]="fixture.x"
              [attr.cy]="fixture.y"
              [attr.r]="plan.fixtureR"
            />
            <g class="tip">
              <rect
                class="tip-box"
                [attr.x]="fixture.tipX"
                [attr.y]="fixture.tipY"
                [attr.width]="fixture.tipW"
                [attr.height]="fixture.tipH"
                [attr.rx]="fixture.tipRx"
              />
              <text
                class="tip-text"
                [attr.x]="fixture.textX"
                [attr.y]="fixture.textY"
                [attr.font-size]="fixture.tipFont"
                text-anchor="middle"
                dominant-baseline="middle"
              >
                {{ fixture.label }}
              </text>
            </g>
          </g>
        }

        @for (vertex of plan.vertices; track $index) {
          <g class="hit">
            <circle
              class="hit-pad"
              tabindex="0"
              [attr.cx]="vertex.x"
              [attr.cy]="vertex.y"
              [attr.r]="plan.hitR"
              [attr.aria-label]="vertex.aria"
            />
            <circle
              class="mark vertex-mark"
              [attr.cx]="vertex.x"
              [attr.cy]="vertex.y"
              [attr.r]="plan.vertexR"
            />
            <g class="tip">
              <rect
                class="tip-box"
                [attr.x]="vertex.tipX"
                [attr.y]="vertex.tipY"
                [attr.width]="vertex.tipW"
                [attr.height]="vertex.tipH"
                [attr.rx]="vertex.tipRx"
              />
              <text
                class="tip-text"
                [attr.x]="vertex.textX"
                [attr.y]="vertex.textY"
                [attr.font-size]="vertex.tipFont"
                text-anchor="middle"
                dominant-baseline="middle"
              >
                {{ vertex.label }}
              </text>
            </g>
          </g>
        }
      </svg>
    </div>
    @if (grid()?.error; as message) {
      <p class="mt-3 font-mono text-xs text-primary">{{ message }}</p>
    }
    @if (!chrome() && caption(); as text) {
      <p class="mt-3 font-mono text-xs text-muted">{{ text }}</p>
    }
  } @else {
    <div
      class="flex min-h-[220px] items-center justify-center border border-dashed border-border px-4 py-10 text-center"
    >
      <p class="m-0 font-body text-sm text-muted">
        Enter Width 1, Length 1, Width 2, and Length 2 to preview the room.
      </p>
    </div>
  }
</div>
