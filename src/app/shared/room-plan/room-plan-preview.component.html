<div class="rounded-xl border border-border bg-elevated p-4 sm:p-5">
  <div class="mb-3 flex items-center justify-between gap-3">
    <span class="font-mono text-xs tracking-widest text-primary uppercase">Layout preview</span>
    @if (caption(); as text) {
      <span class="font-mono text-xs text-muted text-right">{{ text }}</span>
    }
  </div>

  @if (view(); as plan) {
    <div class="aspect-[5/4] w-full">
      <svg
        class="h-full w-full"
        [attr.viewBox]="plan.viewBox"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        [attr.aria-label]="ariaLabel()"
      >
        <title>Room layout preview</title>
        <desc>{{ ariaLabel() }}</desc>

        <rect
          x="0"
          y="0"
          [attr.width]="plan.lengthX"
          [attr.height]="plan.widthY"
          fill="rgba(255,255,255,0.04)"
          stroke="#2B2B2B"
          stroke-width="1.5"
          vector-effect="non-scaling-stroke"
        />

        <circle
          [attr.cx]="plan.origin.x"
          [attr.cy]="plan.origin.y"
          [attr.r]="plan.origin.r"
          fill="#EB1B26"
        />
        <text
          [attr.x]="plan.origin.x + plan.fontSize * 0.35"
          [attr.y]="plan.origin.y - plan.fontSize * 0.35"
          [attr.font-size]="plan.fontSize * 0.75"
          fill="#B8B8B8"
          font-family="JetBrains Mono, monospace"
        >
          (0, 0)
        </text>

        @for (label of plan.labels; track label.text) {
          <text
            [attr.x]="label.x"
            [attr.y]="label.y"
            [attr.font-size]="plan.fontSize * 0.85"
            [attr.text-anchor]="label.anchor"
            fill="#B8B8B8"
            font-family="JetBrains Mono, monospace"
            dominant-baseline="middle"
          >
            {{ label.text }}
          </text>
        }

        @for (fixture of plan.fixtures; track $index) {
          <circle
            [attr.cx]="fixture.x"
            [attr.cy]="fixture.y"
            [attr.r]="plan.fixtureR"
            fill="#EB1B26"
            stroke="#ffffff"
            stroke-width="0.6"
            vector-effect="non-scaling-stroke"
          />
        }
      </svg>
    </div>
    @if (grid()?.error; as message) {
      <p class="mt-3 font-mono text-xs text-primary">{{ message }}</p>
    }
  } @else {
    <div
      class="flex min-h-[220px] items-center justify-center border border-dashed border-border px-4 py-10 text-center"
    >
      <p class="m-0 font-body text-sm text-muted">
        Enter Width 1, Length 1, Width 2, and Length 2 to preview the room.
      </p>
    </div>
  }
</div>
