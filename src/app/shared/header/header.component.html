<header class="fixed top-0 left-0 right-0 z-50 border-b border-border bg-black/80 backdrop-blur-md">
  <div class="mx-auto flex max-w-[1440px] items-center justify-between px-12 py-4">
    <a routerLink="/" class="font-[Anton] text-xl tracking-wide text-white uppercase">
      LuxScale AI
    </a>
    <nav class="flex items-center gap-8">
      @for (item of navItems(); track item.href) {
        <a [href]="item.href" class="text-sm text-muted transition-colors duration-180 hover:text-white">
          {{ item.label }}
        </a>
      }
      <a href="#" class="rounded-xl bg-primary px-6 py-3 text-sm font-medium text-white transition-colors duration-180 hover:bg-primary-dark">
        Get Started
      </a>
    </nav>
  </div>
</header>
