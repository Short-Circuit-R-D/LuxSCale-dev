<header class="fixed top-0 left-0 right-0 z-50 border-b border-border bg-black/80 backdrop-blur-md">
  <div class="mx-auto flex max-w-[1440px] items-center justify-between px-4 py-4 sm:px-6 md:px-12">
    <a routerLink="/">
      <img src="luxscale-logo.svg" alt="LuxScale AI" class="h-8" />
    </a>

    <!-- Desktop nav -->
    <nav class="hidden items-center gap-8 md:flex">
      @for (item of navItems(); track item.href) {
        <a
          [href]="item.href"
          class="text-sm text-muted transition-colors duration-180 hover:text-white"
        >
          {{ item.label }}
        </a>
      }
      <a
        routerLink="/create-study"
        class="rounded-xl bg-primary px-6 py-3 text-sm font-medium text-white transition-colors duration-180 hover:bg-primary-dark"
      >
        Get Started
      </a>
    </nav>

    <!-- Mobile hamburger -->
    <button
      type="button"
      class="flex items-center justify-center w-10 h-10 md:hidden"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-label="Toggle navigation menu"
    >
      @if (mobileMenuOpen()) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="text-white"
        >
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="text-white"
        >
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      }
    </button>
  </div>

  <!-- Mobile drawer -->
  @if (mobileMenuOpen()) {
    <nav class="border-t border-border bg-black/95 backdrop-blur-md md:hidden">
      <div class="flex flex-col px-4 py-4 sm:px-6">
        @for (item of navItems(); track item.href) {
          <a
            [href]="item.href"
            class="py-3 text-sm text-muted transition-colors duration-180 hover:text-white border-b border-border last:border-b-0"
            (click)="closeMobileMenu()"
          >
            {{ item.label }}
          </a>
        }
        <a
          routerLink="/create-study"
          class="mt-4 rounded-xl bg-primary px-6 py-3 text-sm font-medium text-white text-center transition-colors duration-180 hover:bg-primary-dark"
          (click)="closeMobileMenu()"
        >
          Get Started
        </a>
      </div>
    </nav>
  }
</header>
